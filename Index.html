<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glutenfrei Verkostungs-Tracker</title>
    <!-- Tailwind CSS für modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode Bibliothek für den Barcode-Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>🌾</span> Glutenfrei Tracker
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('scanner')" id="btn-scanner" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">
                    📷 Scannen
                </button>
                <button onclick="switchTab('list')" id="btn-list" class="bg-emerald-800 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm">
                    📋 Meine Liste (<span id="product-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- TAB 1: SCANNER & FORMULAR -->
        <section id="tab-scanner" class="space-y-6">
            
            <!-- Scanner Box -->
            <div class="bg-white rounded-2xl shadow-sm p-5 border border-emerald-100">
                <h2 class="text-lg font-semibold text-emerald-800 mb-3">Produkt scannen</h2>
                <div id="reader" class="w-full rounded-xl overflow-hidden bg-gray-100 border border-gray-200"></div>
                <div class="mt-4 flex gap-2">
                    <input type="text" id="manual-barcode" placeholder="Oder EAN-Code manuell eingeben..." class="flex-grow border border-gray-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="fetchProduct(document.getElementById('manual-barcode').value)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
                        Suchen
                    </button>
                </div>
            </div>

            <!-- Produkt- & Bewertungsformular -->
            <div id="form-container" class="bg-white rounded-2xl shadow-sm p-5 border border-emerald-100 hidden">
                <h2 class="text-lg font-semibold text-emerald-800 mb-4 flex items-center justify-between">
                    <span>Produkt bewerten</span>
                    <span id="api-status" class="text-xs font-normal text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full">Open Food Facts verbunden</span>
                </h2>

                <form id="review-form" onsubmit="saveProduct(event)" class="space-y-4">
                    <input type="hidden" id="prod-barcode">
                    <input type="hidden" id="prod-image">

                    <div class="flex items-center gap-4 bg-emerald-50/50 p-3 rounded-xl">
                        <img id="prod-img-preview" src="" alt="" class="w-16 h-16 object-contain rounded-lg bg-white border border-emerald-100 hidden">
                        <div>
                            <h3 id="prod-name-display" class="font-bold text-gray-900"></h3>
                            <p id="prod-details-display" class="text-xs text-gray-500"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Produktname</label>
                            <input type="text" id="prod-name" required class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Hersteller / Marke</label>
                            <input type="text" id="prod-brand" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategorie</label>
                            <input type="text" id="prod-category" placeholder="z.B. Brot, Mehl, Snack" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kaufort / Laden</label>
                            <input type="text" id="prod-store" placeholder="z.B. Rewe, DM, Edeka" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Preis (€)</label>
                            <input type="number" step="0.01" id="prod-price" placeholder="2.99" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Geschmack (1-5 Sterne)</label>
                        <div class="flex gap-2 items-center text-2xl" id="star-rating">
                            <span onclick="setRating(1)" class="cursor-pointer text-gray-300 hover:text-amber-400 transition" data-value="1">★</span>
                            <span onclick="setRating(2)" class="cursor-pointer text-gray-300 hover:text-amber-400 transition" data-value="2">★</span>
                            <span onclick="setRating(3)" class="cursor-pointer text-gray-300 hover:text-amber-400 transition" data-value="3">★</span>
                            <span onclick="setRating(4)" class="cursor-pointer text-gray-300 hover:text-amber-400 transition" data-value="4">★</span>
                            <span onclick="setRating(5)" class="cursor-pointer text-gray-300 hover:text-amber-400 transition" data-value="5">★</span>
                            <span id="rating-text" class="text-sm text-gray-500 ml-2 font-medium">Bitte wählen</span>
                        </div>
                        <input type="hidden" id="prod-rating" value="0" required>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Notizen / Fazit</label>
                        <textarea id="prod-notes" rows="3" placeholder="Wie war die Konsistenz? Würdest du es wieder kaufen?" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>

                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" onclick="resetForm()" class="px-4 py-2 border border-gray-300 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition">Abbrechen</button>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition shadow-sm">Speichern</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- TAB 2: PRODUKT-LISTE -->
        <section id="tab-list" class="space-y-4 hidden">
            <div class="flex flex-col sm:flex-row gap-3 justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
                <input type="text" id="search-input" oninput="renderList()" placeholder="Nach Name, Marke oder Ort suchen..." class="w-full sm:w-72 border border-gray-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="flex gap-2 w-full sm:w-auto">
                    <select id="filter-rating" onchange="renderList()" class="border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="">Alle Sterne</option>
                        <option value="5">5 Sterne</option>
                        <option value="4">4+ Sterne</option>
                        <option value="3">3+ Sterne</option>
                    </select>
                </div>
            </div>

            <div id="product-list" class="space-y-3">
                <!-- Dynamische Einträge -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-500">
        Glutenfrei Verkostungs-Tracker &bull; Daten via Open Food Facts
    </footer>

    <!-- JavaScript Logik -->
    <script>
        let products = JSON.parse(localStorage.getItem('gf_products')) || [];
        let html5QrCode = null;
        let currentRating = 0;

        function switchTab(tab) {
            document.getElementById('tab-scanner').classList.toggle('hidden', tab !== 'scanner');
            document.getElementById('tab-list').classList.toggle('hidden', tab !== 'list');
            
            document.getElementById('btn-scanner').className = tab === 'scanner' 
                ? 'bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm'
                : 'bg-emerald-800 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm';
            
            document.getElementById('btn-list').className = tab === 'list' 
                ? 'bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm'
                : 'bg-emerald-800 hover:bg-emerald-600 px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm';

            if (tab === 'scanner') {
                initScanner();
            } else {
                stopScanner();
                renderList();
            }
            updateCount();
        }

        function initScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    stopScanner();
                    document.getElementById('manual-barcode').value = decodedText;
                    fetchProduct(decodedText);
                },
                (error) => {}
            ).catch(err => {
                console.log("Kamera konnte nicht gestartet werden:", err);
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        async function fetchProduct(barcode) {
            if (!barcode) return;
            barcode = barcode.trim();
            
            const statusBadge = document.getElementById('api-status');
            statusBadge.innerText = "Lade Produktdaten...";
            
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await response.json();

                document.getElementById('form-container').classList.remove('hidden');
                document.getElementById('prod-barcode').value = barcode;

                if (data.status === 1) {
                    const p = data.product;
                    const name = p.product_name || p.product_name_de || "Unbekanntes Produkt";
                    const brand = p.brands || "Unbekannter Hersteller";
                    const category = p.categories_tags && p.categories_tags.length > 0 ? p.categories_tags[0].replace('en:', '').replace(/-/g, ' ') : '';
                    const imageUrl = p.image_front_url || '';

                    document.getElementById('prod-name').value = name;
                    document.getElementById('prod-brand').value = brand;
                    document.getElementById('prod-category').value = category;
                    document.getElementById('prod-image').value = imageUrl;

                    if (imageUrl) {
                        const imgEl = document.getElementById('prod-img-preview');
                        imgEl.src = imageUrl;
                        imgEl.classList.remove('hidden');
                    }

                    statusBadge.innerText = "Produktdaten erfolgreich geladen!";
                } else {
                    statusBadge.innerText = "Produkt nicht in Datenbank – bitte manuell ausfüllen.";
                    document.getElementById('prod-name').value = "";
                    document.getElementById('prod-brand').value = "";
                    document.getElementById('prod-category').value = "";
                    document.getElementById('prod-img-preview').classList.add('hidden');
                }
            } catch (err) {
                console.error(err);
                statusBadge.innerText = "Fehler bei API-Abfrage – manuell ausfüllen.";
                document.getElementById('form-container').classList.remove('hidden');
            }
        }

        function setRating(rating) {
            currentRating = rating;
            document.getElementById('prod-rating').value = rating;
            const texts = ["", "Schlecht 🤢", "Geht so 😐", "Gut 🙂", "Sehr gut 😋", "Favorit! 😍"];
            document.getElementById('rating-text').innerText = texts[rating];

            const stars = document.querySelectorAll('#star-rating span[data-value]');
            stars.forEach(star => {
                if (star.getAttribute('data-value') <= rating) {
                    star.classList.remove('text-gray-300');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-gray-300');
                }
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            const product = {
                id: Date.now(),
                barcode: document.getElementById('prod-barcode').value,
                name: document.getElementById('prod-name').value,
                brand: document.getElementById('prod-brand').value,
                category: document.getElementById('prod-category').value,
                store: document.getElementById('prod-store').value,
                price: document.getElementById('prod-price').value,
                rating: parseInt(document.getElementById('prod-rating').value),
                notes: document.getElementById('prod-notes').value,
                image: document.getElementById('prod-image').value,
                date: new Date().toLocaleDateString('de-DE')
            };

            products.unshift(product);
            localStorage.setItem('gf_products', JSON.stringify(products));

            resetForm();
            switchTab('list');
        }

        function resetForm() {
            document.getElementById('review-form').reset();
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('prod-img-preview').classList.add('hidden');
            setRating(0);
            document.getElementById('manual-barcode').value = '';
            initScanner();
        }

        function deleteProduct(id) {
            if (confirm("Möchtest du diesen Eintrag wirklich löschen?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('gf_products', JSON.stringify(products));
                renderList();
                updateCount();
            }
        }

        function renderList() {
            const listEl = document.getElementById('product-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const minRating = parseInt(document.getElementById('filter-rating').value) || 0;

            const filtered = products.filter(p => {
                const matchesSearch = (p.name + ' ' + p.brand + ' ' + p.store + ' ' + p.category).toLowerCase().includes(search);
                const matchesRating = p.rating >= minRating;
                return matchesSearch && matchesRating;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-400 border border-emerald-100">Keine Einträge gefunden.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                    <div class="flex gap-3 items-center">
                        ${p.image ? `<img src="${p.image}" class="w-14 h-14 object-contain rounded-xl bg-gray-50 p-1 border border-gray-100">` : `<div class="w-14 h-14 bg-emerald-50 rounded-xl flex items-center justify-center text-xl">🌾</div>`}
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-gray-900">${p.name}</h4>
                                <span class="text-xs bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md font-medium">${p.brand || 'Keine Marke'}</span>
                            </div>
                            <div class="text-xs text-gray-500 mt-1 flex flex-wrap gap-x-3 gap-y-1">
                                ${p.store ? `<span>🛒 ${p.store}</span>` : ''}
                                ${p.price ? `<span>💶 ${p.price} €</span>` : ''}
                                ${p.category ? `<span>📁 ${p.category}</span>` : ''}
                                <span>📅 ${p.date}</span>
                            </div>
                            ${p.notes ? `<p class="text-sm text-gray-600 mt-2 bg-gray-50 p-2 rounded-xl">"${p.notes}"</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center justify-between w-full sm:w-auto gap-4 border-t sm:border-t-0 pt-3 sm:pt-0 border-gray-100">
                        <div class="text-amber-400 text-lg">
                            ${'★'.repeat(p.rating)}${'☆'.repeat(5 - p.rating)}
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="text-gray-400 hover:text-red-500 p-2 transition">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateCount() {
            document.getElementById('product-count').innerText = products.length;
        }

        updateCount();
        initScanner();
    </script>
</body>
</html>
