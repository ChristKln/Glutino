<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5ee">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("gf_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<title>Glutino – Glutenfrei-Tagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5ee;--surface:#fff;--surface2:#e8eee3;--ink:#14201a;--muted:#5d6b62;--line:#d9e1d3;
  --brand:#1f5a43;--on-brand:#fff;--gold:#e8a900;--danger:#c0392b;--shadow:0 8px 28px rgba(20,32,26,.10);
  --r:22px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1613;--surface:#18221d;--surface2:#212d26;--ink:#eaf1ea;--muted:#93a498;--line:#2a372f;
  --brand:#7fd1a6;--on-brand:#0b1a12;--gold:#f2bd2c;--danger:#ff7b6b;--shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:400 16px/1.45 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* Kopf */
header{padding:calc(22px + env(safe-area-inset-top)) 0 8px}
.top{display:flex;justify-content:space-between;align-items:center}
.icon{width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:1.3rem}
header h1{font-size:2.6rem;font-weight:800;line-height:1}
header p{margin:6px 0 0;color:var(--muted)}

/* Suche und Filter */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:10px 0 8px;margin-top:8px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.search select{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 10px}
.dds{display:flex;gap:8px;padding-top:10px}
.dd{position:relative;flex:1;min-width:0}
.dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap}
.dd-btn.active{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dd-panel{display:none;position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(320px,calc(100vw - 36px));max-height:55dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px}
.dd.open .dd-panel{display:block}
#dd-brand .dd-panel{left:auto;right:0}
.dd-reset{width:100%;text-align:left;padding:10px 12px;color:var(--brand);font-weight:700;border-radius:12px}
.opt{display:flex;align-items:center;gap:12px;margin:0;padding:10px 12px;border-radius:12px;font-weight:500;font-size:1rem;cursor:pointer}
.opt:hover{background:var(--surface2)}
.opt input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.opt span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.opt em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.8rem}

/* Karten */
#list{display:grid;gap:12px;margin-top:10px}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.98)}
.thumb{width:64px;height:64px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;font-size:1.6rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:1.05rem;line-height:1.2}
.meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.note{font-size:.88rem;margin-top:6px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#2a1d00;font:800 1.4rem 'Bricolage Grotesque',sans-serif}
.score.low{background:var(--surface2);color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;font:800 1.3rem 'Bricolage Grotesque',sans-serif;color:var(--ink);margin-bottom:6px}

/* Untere Leiste */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:6px;padding:8px;border-radius:999px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);border:1px solid var(--line)}
nav button{padding:12px 20px;border-radius:999px;font-weight:700;color:var(--muted)}
nav button.on{background:var(--surface2);color:var(--ink)}
nav .scan{background:var(--brand);color:var(--on-brand);padding:14px 26px;box-shadow:0 6px 18px rgba(31,90,67,.35)}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.panel h2{font-size:1.5rem;margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 6px}
.f{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:4px;align-items:center}
.stars button{font-size:2.3rem;line-height:1;color:var(--line);transition:transform .12s,color .12s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.25)}
.stars small{margin-left:8px;color:var(--muted);font-weight:500}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:14px;border-radius:16px;font-weight:700;background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--on-brand);flex:2}
.btn.danger{color:var(--danger);flex:none;padding:14px 18px}
#cam{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:4/3}
#cam video,#reader{width:100%;height:100%;object-fit:cover}
#cam .frame{position:absolute;inset:22% 10%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0}
.preview{display:flex;gap:12px;align-items:center;background:var(--surface);padding:10px;border-radius:18px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-90px);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:500;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top"><h1>Glutino</h1><button id="theme" class="icon" onclick="toggleTheme()" aria-label="Zwischen Tag- und Nachtmodus wechseln"></button></div>
    <p>Dein glutenfreies Verkostungs-Tagebuch</p>
  </header>

  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="Name, Marke oder Laden suchen" aria-label="Suchen">
      <select id="sort" aria-label="Sortieren">
        <option value="new">Neueste</option>
        <option value="rating">Beste</option>
        <option value="name">A–Z</option>
        <option value="price">Preis</option>
      </select>
    </div>
    <div class="dds"><div class="dd" id="dd-cat"></div><div class="dd" id="dd-brand"></div></div>
  </div>

  <main id="list"></main>
</div>

<nav aria-label="Hauptmenü">
  <button id="n-list" class="on" onclick="scrollTo({top:0,behavior:'smooth'})">Liste</button>
  <button class="scan" onclick="openScan()">Scannen</button>
  <button id="n-more" onclick="openSheet('more')">Mehr</button>
</nav>

<!-- Scanner -->
<div class="sheet" id="sh-scan" onclick="if(event.target===this)closeScan()">
  <div class="panel">
    <div class="grab"></div>
    <h2>Barcode scannen</h2>
    <div id="cam">
      <video id="video" playsinline muted></video>
      <div id="reader" class="hidden"></div>
      <div class="frame"></div>
    </div>
    <p class="hint hidden" id="cam-err">Die Kamera startet nicht. Prüfe die Berechtigung oder gib den Code unten ein.</p>
    <label for="manual">Oder Code eintippen</label>
    <div style="display:flex;gap:8px">
      <input class="f" id="manual" inputmode="numeric" placeholder="EAN, z. B. 4001234567890">
      <button class="btn primary" style="flex:none;padding:0 20px" onclick="found($('#manual').value)">Suchen</button>
    </div>
    <div class="actions"><button class="btn" onclick="closeScan()">Schließen</button></div>
  </div>
</div>

<!-- Formular -->
<div class="sheet" id="sh-form" onclick="if(event.target===this)closeSheet('form')">
  <div class="panel">
    <div class="grab"></div>
    <h2 id="f-title">Produkt bewerten</h2>
    <form id="form" onsubmit="saveProduct(event)">
      <div class="preview">
        <div class="thumb" id="f-thumb">🌾</div>
        <div><b id="f-name-d"></b><div class="meta" id="f-src"></div></div>
      </div>
      <label for="f-name">Produktname</label>
      <input class="f" id="f-name" required>
      <label for="f-brand">Marke</label>
      <input class="f" id="f-brand">
      <label for="f-cat">Kategorie</label>
      <select class="f" id="f-cat"></select>
      <div class="row">
        <div><label for="f-store">Gekauft bei</label><input class="f" id="f-store" placeholder="Rewe, dm, Edeka"></div>
        <div><label for="f-price">Preis in €</label><input class="f" id="f-price" type="number" step="0.01" min="0" inputmode="decimal"></div>
      </div>
      <label>Geschmack</label>
      <div class="stars" id="stars"></div>
      <label for="f-notes">Notizen</label>
      <textarea class="f" id="f-notes" rows="3" placeholder="Konsistenz, Geschmack, nochmal kaufen?"></textarea>
      <div class="actions">
        <button type="button" class="btn danger hidden" id="f-del" onclick="deleteProduct()">Löschen</button>
        <button type="button" class="btn" onclick="closeSheet('form')">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </div>
</div>

<!-- Mehr -->
<div class="sheet" id="sh-more" onclick="if(event.target===this)closeSheet('more')">
  <div class="panel">
    <div class="grab"></div>
    <h2>Mehr</h2>
    <p class="hint">Deine Daten liegen nur in diesem Browser. Sichere sie regelmäßig oder zieh sie auf ein neues Gerät um.</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn" onclick="exportData()">Daten exportieren</button>
      <button class="btn" onclick="$('#imp').click()">Daten importieren</button>
      <input type="file" id="imp" accept="application/json" class="hidden" onchange="importData(event)">
      <button class="btn" onclick="closeSheet('more')">Schließen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE = [['Brot','🍞'],['Brötchen & Gebäck','🥐'],['Kuchen & Kekse','🍪'],['Mehl & Backmischungen','🌾'],['Backzutaten','🧁'],['Nudeln','🍝'],['Reis & Getreide','🍚'],['Pizza & Tiefkühl','🍕'],['Fertiggerichte','🍲'],['Suppen & Saucen','🥫'],['Snacks & Knabberzeug','🥨'],['Müsli & Frühstück','🥣'],['Aufstriche','🍯'],['Süßigkeiten','🍫'],['Milch & Alternativen','🥛'],['Getränke & Bier','🍺'],['Sonstiges','📦']];
let custom = (() => { try { return JSON.parse(localStorage.getItem('gf_cats')) || []; } catch { return []; } })();
const allCats = () => {
  const known = new Set(BASE.map(c => c[0]));
  const extra = [...new Set([...custom, ...products.map(p => p.category)].filter(c => c && !known.has(c)))];
  return BASE.concat(extra.map(c => [c, '🏷️'])).sort((x, y) => x[0].localeCompare(y[0], 'de', { sensitivity:'base' }));
};
const LABELS = ['Bitte wählen','Schlecht','Geht so','Gut','Sehr gut','Favorit'];
const emoji = c => (allCats().find(x => x[0] === c) || ['','📦'])[1];

let products = (() => { try { return JSON.parse(localStorage.getItem('gf_products')) || []; } catch { return []; } })();
let filt = { q:'', cat:new Set(), brand:new Set(), sort:'new' };
let editing = null, rating = 0;

function persist(){
  try { localStorage.setItem('gf_products', JSON.stringify(products)); }
  catch { toast('Speichern nicht möglich. Ist der Speicher voll?'); }
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
const buzz = () => navigator.vibrate && navigator.vibrate(25);
function openSheet(id){ $('#sh-'+id).classList.add('open'); }
function closeSheet(id){ $('#sh-'+id).classList.remove('open'); }

/* Liste */
function render(){
  const bs = new Set(products.map(p => p.brand || '')); filt.brand.forEach(b => bs.has(b) || filt.brand.delete(b));
  const cs = new Set(allCats().map(c => c[0])); filt.cat.forEach(c => cs.has(c) || filt.cat.delete(c));
  renderChips();
  const q = filt.q.toLowerCase();
  let items = products.filter(p =>
    (!filt.cat.size || filt.cat.has(p.category)) &&
    (!filt.brand.size || filt.brand.has(p.brand || '')) &&
    (p.name+' '+p.brand+' '+p.store).toLowerCase().includes(q));
  const by = {
    new:(a,b)=>b.id-a.id,
    rating:(a,b)=>b.rating-a.rating||b.id-a.id,
    name:(a,b)=>a.name.localeCompare(b.name,'de'),
    price:(a,b)=>(parseFloat(a.price)||1e9)-(parseFloat(b.price)||1e9)
  };
  items.sort(by[filt.sort]);

  $('#list').innerHTML = items.length ? items.map(p => `
    <button class="card" onclick="openForm(${p.id})">
      <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : emoji(p.category)}</div>
      <div>
        <h3>${esc(p.name)}</h3>
        <div class="meta">${[p.brand,p.store,p.price?Number(p.price).toFixed(2).replace('.',',')+' €':''].filter(Boolean).map(esc).join(' • ')}</div>
        ${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ''}
      </div>
      <div class="score ${p.rating<3?'low':''}" aria-label="${p.rating} von 5 Sternen">${p.rating}</div>
    </button>`).join('')
    : `<div class="empty"><b>${products.length ? 'Nichts gefunden' : 'Noch nichts im Tagebuch'}</b>${products.length ? 'Ändere Suche oder Filter.' : 'Tippe auf Scannen und bewerte dein erstes Produkt.'}</div>`;

}
function buildDD(id, label, opts, set){
  const el = $('#'+id), old = el.querySelector('.dd-panel'), st = old ? old.scrollTop : 0;
  el.innerHTML = `<button type="button" class="dd-btn ${set.size?'active':''}" aria-expanded="${el.classList.contains('open')}" onclick="toggleDD('${id}')"><span>${label}${set.size?' ('+set.size+')':''}</span><span>▾</span></button>
    <div class="dd-panel" role="group" aria-label="${label}">
      <button type="button" class="dd-reset" onclick="clearDD('${id}')">Auswahl zurücksetzen</button>
      ${opts.map(([v,l,n]) => `<label class="opt"><input type="checkbox" value="${esc(v)}" ${set.has(v)?'checked':''}><span>${esc(l)}</span><em>${n}</em></label>`).join('')}
    </div>`;
  el.querySelector('.dd-panel').scrollTop = st;
}
function renderChips(){
  const count = f => products.reduce((m,p) => (m[f(p)] = (m[f(p)]||0)+1, m), {});
  const cc = count(p => p.category), bc = count(p => p.brand || '');
  buildDD('dd-cat', 'Kategorie', allCats().map(c => [c[0], c[1]+' '+c[0], cc[c[0]]||0]), filt.cat);
  const brands = Object.keys(bc).sort((a,b) => (a || 'Ohne Marke').localeCompare(b || 'Ohne Marke', 'de', { sensitivity:'base' }));
  buildDD('dd-brand', 'Hersteller', brands.map(b => [b, b || 'Ohne Marke', bc[b]]), filt.brand);
}
function toggleDD(id){
  document.querySelectorAll('.dd').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
  const el = $('#'+id); el.classList.toggle('open');
  el.querySelector('.dd-btn').setAttribute('aria-expanded', el.classList.contains('open'));
}
function clearDD(id){ (id === 'dd-cat' ? filt.cat : filt.brand).clear(); render(); }
document.addEventListener('change', e => {
  const cb = e.target.closest('.dd input'); if (!cb) return;
  const set = cb.closest('.dd').id === 'dd-cat' ? filt.cat : filt.brand;
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  render();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.dd')) document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
});
function fillCats(sel){
  const list = allCats();
  $('#f-cat').innerHTML = list.map(c => `<option value="${esc(c[0])}">${c[1]} ${esc(c[0])}</option>`).join('')
    + '<option value="__new">＋ Eigene Kategorie …</option>';
  if (sel) $('#f-cat').value = sel;
}
let lastCat = 'Sonstiges';
$('#f-cat').onchange = e => {
  if (e.target.value !== '__new') { lastCat = e.target.value; return; }
  const n = (prompt('Name der neuen Kategorie:') || '').trim();
  if (!n) { e.target.value = lastCat; return; }
  if (!allCats().some(c => c[0].toLowerCase() === n.toLowerCase())) {
    custom.push(n);
    try { localStorage.setItem('gf_cats', JSON.stringify(custom)); } catch {}
  }
  const name = allCats().find(c => c[0].toLowerCase() === n.toLowerCase())[0];
  fillCats(name); lastCat = name; renderChips();
};
$('#q').oninput = e => { filt.q = e.target.value; render(); };
$('#sort').onchange = e => { filt.sort = e.target.value; render(); };
$('#stars').innerHTML = [1,2,3,4,5].map(i => `<button type="button" aria-label="${i} Sterne" onclick="setRating(${i})">★</button>`).join('') + '<small id="r-text"></small>';

function setRating(r){
  rating = r; buzz();
  $('#stars').querySelectorAll('button').forEach((b,i) => b.classList.toggle('on', i < r));
  $('#r-text').textContent = LABELS[r];
}

/* Scanner: erst eingebaute Barcode-API, sonst Bibliothek als Ersatz */
let stream = null, scanning = false, h5 = null;
async function openScan(){
  openSheet('scan'); $('#cam-err').classList.add('hidden'); $('#manual').value = '';
  try {
    if ('BarcodeDetector' in window) {
      const det = new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e'] });
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      const v = $('#video'); v.srcObject = stream; v.classList.remove('hidden'); $('#reader').classList.add('hidden');
      await v.play(); scanning = true;
      const tick = async () => {
        if (!scanning) return;
        try { const r = await det.detect(v); if (r.length) return found(r[0].rawValue); } catch {}
        setTimeout(tick, 200);
      };
      tick();
    } else {
      await new Promise((ok, no) => {
        if (window.Html5Qrcode) return ok();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
        s.onload = ok; s.onerror = no; document.head.appendChild(s);
      });
      $('#video').classList.add('hidden'); $('#reader').classList.remove('hidden');
      h5 = new Html5Qrcode('reader');
      await h5.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:250, height:150 } }, t => found(t), () => {});
    }
  } catch (e) { $('#cam-err').classList.remove('hidden'); }
}
async function stopCam(){
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (h5) { try { await h5.stop(); } catch {} h5 = null; }
}
async function closeScan(){ await stopCam(); closeSheet('scan'); }
async function found(code){
  code = String(code || '').replace(/\D/g,'');
  if (!code) return toast('Bitte einen gültigen Barcode eingeben.');
  buzz(); await closeScan(); lookup(code);
}

/* Produktdaten von Open Food Facts */
function guessCat(tags){
  const s = JSON.stringify(tags || []).toLowerCase();
  if (/brötchen|rolls|buns|croissant|pastr/.test(s)) return 'Brötchen & Gebäck';
  if (/cake|kuchen|cookie|keks|biscuit/.test(s)) return 'Kuchen & Kekse';
  if (/pizza|frozen|tiefk/.test(s)) return 'Pizza & Tiefkühl';
  if (/soup|suppe|sauce|soße/.test(s)) return 'Suppen & Saucen';
  if (/spread|aufstrich|jam|marmelade|honey|nutella/.test(s)) return 'Aufstriche';
  if (/rice|reis|oat|hafer|quinoa|hirse|grain/.test(s)) return 'Reis & Getreide';
  if (/beverage|drink|beer|bier|getränk/.test(s)) return 'Getränke & Bier';
  if (/milk|milch|yogurt|joghurt|plant-based/.test(s)) return 'Milch & Alternativen';
  if (/baking|backzutat|yeast|hefe/.test(s)) return 'Backzutaten';
  if (/bread|brot/.test(s)) return 'Brot';
  if (/flour|mehl|mix/.test(s)) return 'Mehl & Backmischungen';
  if (/pasta|nudel/.test(s)) return 'Nudeln';
  if (/snack|chips|cracker/.test(s)) return 'Snacks & Knabberzeug';
  if (/breakfast|muesli|cereal/.test(s)) return 'Müsli & Frühstück';
  if (/chocolate|sweet|candy/.test(s)) return 'Süßigkeiten';
  if (/meal|pizza|soup/.test(s)) return 'Fertiggerichte';
  return 'Sonstiges';
}
async function lookup(barcode){
  const known = products.find(p => p.barcode === barcode);
  if (known) { toast('Schon im Tagebuch. Du kannst ihn bearbeiten.'); return openForm(known.id); }
  toast('Suche Produktdaten …');
  let d = { barcode, name:'', brand:'', category:'Sonstiges', image:'', src:'Nicht gefunden. Bitte selbst ausfüllen.' };
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json?fields=product_name,product_name_de,brands,image_front_small_url,categories_tags`);
    const j = await r.json();
    if (j.status === 1 && j.product) {
      const p = j.product;
      d = { barcode, name:p.product_name_de || p.product_name || '', brand:(p.brands || '').split(',')[0].trim(),
            category:guessCat(p.categories_tags), image:p.image_front_small_url || '', src:'Daten von Open Food Facts' };
    }
  } catch { d.src = 'Keine Verbindung. Bitte selbst ausfüllen.'; }
  openForm(null, d);
}

/* Formular */
function openForm(id, draft){
  editing = id ? products.find(p => p.id === id) : null;
  const p = editing || draft || { barcode:'', name:'', brand:'', category:'Sonstiges', image:'', src:'Manuell erfasst' };
  $('#f-title').textContent = editing ? 'Eintrag bearbeiten' : 'Produkt bewerten';
  $('#f-name').value = p.name; $('#f-brand').value = p.brand; fillCats(p.category); lastCat = $('#f-cat').value;
  $('#f-store').value = p.store || ''; $('#f-price').value = p.price || ''; $('#f-notes').value = p.notes || '';
  $('#f-name-d').textContent = p.barcode ? 'EAN ' + p.barcode : 'Ohne Barcode';
  $('#f-src').textContent = editing ? 'Erfasst am ' + p.date : p.src;
  $('#f-thumb').innerHTML = p.image ? `<img src="${esc(p.image)}" alt="">` : emoji(p.category);
  $('#f-del').classList.toggle('hidden', !editing);
  form.dataset.barcode = p.barcode || ''; form.dataset.image = p.image || '';
  setRating(editing ? p.rating : 0);
  openSheet('form');
}
function saveProduct(e){
  e.preventDefault();
  if (!rating) return toast('Bitte vergib zuerst Sterne.');
  const data = {
    barcode:form.dataset.barcode, image:form.dataset.image,
    name:$('#f-name').value.trim(), brand:$('#f-brand').value.trim(), category:$('#f-cat').value,
    store:$('#f-store').value.trim(), price:$('#f-price').value, rating, notes:$('#f-notes').value.trim()
  };
  if (editing) Object.assign(editing, data);
  else products.unshift({ id:Date.now(), date:new Date().toLocaleDateString('de-DE'), ...data });
  persist(); closeSheet('form'); renderChips(); render(); toast(editing ? 'Änderungen gespeichert' : 'Gespeichert');
}
function deleteProduct(){
  if (!editing || !confirm('Diesen Eintrag wirklich löschen?')) return;
  products = products.filter(p => p.id !== editing.id);
  persist(); closeSheet('form'); render(); toast('Eintrag gelöscht');
}

/* Export und Import */
function exportData(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(products, null, 2)], { type:'application/json' }));
  a.download = 'glutino-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(e){
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const list = JSON.parse(r.result);
      if (!Array.isArray(list)) throw 0;
      const ids = new Set(products.map(p => p.id));
      const add = list.filter(p => p && p.id && p.name && !ids.has(p.id));
      products = products.concat(add); persist(); render(); closeSheet('more');
      toast(add.length + ' Einträge importiert');
    } catch { toast('Diese Datei ist keine Glutino-Sicherung.'); }
  };
  r.readAsText(f); e.target.value = '';
}

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0f1613' : '#f2f5ee';
}
function toggleTheme(){
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('gf_theme', t); } catch {}
  applyTheme(t);
}
const form = $('#form');
applyTheme(document.documentElement.dataset.theme || 'light');
renderChips(); render();
</script>
